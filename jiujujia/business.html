<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>揪夥伴商用版｜揪居家（延伸期示範）</title>
<style>
:root{--r:#D4003C;--ink:#3D3A40;--mu:#7a7480;--line:#e3c2cc;--head:#FBF3F3;--ok:#3E9B6B;--am:#E0A030}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#faf7f8}
header{background:#fff;border-bottom:3px solid var(--r);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header b{font-size:18px}header .t{color:var(--mu);font-size:14px}
.ban{margin:12px 20px 0;padding:10px 14px;border-radius:8px;background:var(--head);border:1px solid var(--line);font-size:14px}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.types button,.seg button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.types button[aria-pressed="true"]{background:var(--r);color:#fff;border-color:var(--r)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 20px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.ph{padding:10px 14px;background:var(--head);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ph small{font-weight:400;color:var(--mu)}
.pb{padding:12px 14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-top:1px solid #f0e3e8;text-align:left;vertical-align:top}th{background:#fff;color:var(--mu);font-weight:500}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12.5px;background:#eee}
.ok{background:#e5f3ec;color:var(--ok)}.am{background:#fbf0dc;color:#9a6a12}.rd{background:#fbe3ea;color:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi .n{font-size:24px;font-weight:700}.kpi .l{color:var(--mu);font-size:13px}
.b{border:1px solid var(--r);background:#fff;color:var(--r);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}.b.p{background:var(--r);color:#fff}
.layers{display:flex;gap:8px;flex-wrap:wrap}.layers span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px}
.phone{background:#222;border-radius:30px;padding:12px;position:sticky;top:12px}
.scr{background:#f6f2f3;border-radius:20px;min-height:600px;overflow:hidden}
.scr .top{background:#fff;padding:14px 14px 10px;font-weight:700;border-bottom:1px solid #eee}
.note{background:#fff;margin:10px;border-radius:12px;padding:12px;font-size:14px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.note .h{font-size:12px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
footer{color:var(--mu);font-size:12.5px;padding:0 20px 20px}
</style>
</head>
<body>
<header><b>揪夥伴商用版</b><span class="t" id="who"></span>
</header>
<div class="ban" id="ban"></div>
<main>
 <section id="desk"></section>
 <aside><div class="phone" aria-label="手機通知（B2）"><div class="scr" id="mob"></div></div></aside>
</main>
<footer>揪居家｜團隊 五子登科｜InnoConnect+ 2026 全國電子提案。延伸期示範畫面；客戶、據點、設備與日期皆為虛構示意。</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="backend.js?v=20261027i"></script>
<script src="store.js?v=20261125c"></script><script src="store2.js?v=20261125c"></script>
<script src="phase.js?v=20261124a"></script>
<script>
(function(){
const PH=()=>window.JJJPHASE?JJJPHASE():0;
const T={
 day:{n:'日照據點',c:'高雄樂齡日照中心（虛構）',sp:[['活動室','冷氣 ×2','保養到期 12/05','am'],['活動室','空氣清淨機','正常','ok'],['用餐區','冰箱','正常','ok'],['用餐區','電鍋與飲水機','濾心到期 12/10','am'],['浴室','電熱水器','待修：溫度不穩','rd'],['午休室','除濕機','正常','ok']]},
 care:{n:'住宿機構／養老院',c:'高雄○○護理之家（虛構）',sp:[['101 房','冷氣','保養到期 12/03','am'],['102 房','冷氣','正常','ok'],['交誼廳','電視','正常','ok'],['洗衣間','洗衣機 ×3','待修：1 台脫水異常','rd'],['廚房','冰箱 ×2','正常','ok']]},
 rent:{n:'租屋代管與社宅',c:'○○代管（虛構）｜12 戶',sp:[['3F-1','冷氣','保養到期 12/08','am'],['3F-2','洗衣機','正常','ok'],['4F-1','熱水器','待修：點火失敗','rd'],['4F-2','冰箱','正常','ok']]},
 bnb:{n:'民宿',c:'○○民宿（虛構）｜6 間房',sp:[['雙人房 A','冷氣','保養到期 12/12','am'],['雙人房 B','冷氣','正常','ok'],['四人房','除濕機','正常','ok'],['公共區','洗脫烘洗衣機','正常','ok']]},
 shop:{n:'小店',c:'○○咖啡（虛構）',sp:[['吧台','冰箱','保養到期 12/06','am'],['座位區','冷氣 ×2','正常','ok'],['後場','製冰機','待修：出冰變慢','rd']]}};
let k='day';
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
const B={ok:['正常','ok'],am:['保養到期','am'],rd:['待修','rd']};
function render(){
 const d=T[k],p=PH();
  $('who').innerHTML=`客戶類型：<b style="font-size:inherit;color:var(--r)">${d.n}</b>｜${d.c}｜只看自己的據點<span style="color:var(--mu)">（同一版型也服務住宿機構、租屋代管與社宅、民宿、小店）</span>`;
 $('ban').innerHTML=p>=2?'<b style="color:var(--r)">延伸期已開放</b>：揪夥伴商用版提供家電檔案、保養、換新三層服務；不含長輩關懷異常通知（機構已有照服員與緊急呼叫系統）。'
  :`<b>延伸期開放｜示範預覽</b>：目前營運階段為${['試點期','擴展期'][p]}；單店約 194 戶以上（決策點三）才開放商用版。可在企業管理端「營運階段」切換示範。`;
 const due=d.sp.filter(x=>x[3]==='am').length,fix=d.sp.filter(x=>x[3]==='rd').length;
 $('desk').innerHTML=`<div class="kpis"><div class="kpi"><div class="l">空間</div><div class="n">${new Set(d.sp.map(x=>x[0])).size}</div></div><div class="kpi"><div class="l">設備</div><div class="n">${d.sp.length}</div></div><div class="kpi"><div class="l">保養到期</div><div class="n" style="color:#9a6a12">${due}</div></div><div class="kpi"><div class="l">待修</div><div class="n" style="color:var(--r)">${fix}</div></div></div>
 <div class="panel"><div class="ph">多空間設備總覽 <small>依空間列出設備、保養到期與待修</small></div><div style="overflow-x:auto"><table><thead><tr><th>空間</th><th>設備</th><th>狀態</th><th>說明</th></tr></thead><tbody>${d.sp.map(([s,dv,t,c])=>`<tr><td>${s}</td><td>${dv}</td><td><span class="badge ${B[c][1]}">${B[c][0]}</span></td><td>${t}</td></tr>`).join('')}</tbody></table></div>
 <div class="pb" style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #f0e3e8"><button class="b p" data-a="merge">把到期與待修合併成一次到府</button><button class="b" data-a="csv">匯出近半年保養紀錄（CSV）</button></div></div>
 <div class="panel"><div class="ph">服務內容 <small>同一位生活顧問統一排程</small></div><div class="pb"><div class="layers"><span>家電檔案</span><span>家電保養</span><span>家電換新</span><span style="color:var(--mu);border-style:dashed">長輩關懷異常通知：不提供</span></div>
 <div style="font-size:13.5px;color:var(--mu);margin-top:10px;line-height:1.7">保養紀錄可匯出，供評鑑與檢查使用；帳單每月彙整成一張發票。</div></div></div>`;
 const first=d.sp.find(x=>x[3]==='am'),rep=d.sp.find(x=>x[3]==='rd');
 $('mob').innerHTML=`<div class="top">揪夥伴商用版<div style="font-weight:400;font-size:12px;color:var(--mu)">${d.c}</div></div>
 ${first?`<div class="note"><div class="h">保養提醒｜今天 09:00</div><b>${first[0]}｜${first[1]}</b> ${first[2]}。建議在休館或空房時段預約。<div style="margin-top:8px;display:flex;gap:6px"><button class="b p" data-a="book">預約休館時段</button><button class="b" data-a="later">稍後</button></div></div>`:''}
 ${rep?`<div class="note"><div class="h">待修｜昨天 17:20</div><b>${rep[0]}｜${rep[1]}</b> ${rep[2].replace('待修：','')}<div style="margin-top:8px"><button class="b p" data-a="fix">一鍵報修</button></div></div>`:''}
 <div class="note"><div class="h">合併到府</div>${due+fix} 項工作可合併在同一次到府處理。<div style="margin-top:8px"><button class="b" data-a="merge">合併排程</button></div></div>
 <div class="note"><div class="h">本月帳單</div>所有空間彙整成一張發票（示意）。</div>`;
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 const a=t.dataset.a;if(!a)return;
 if(PH()<2&&a!=='later'){toast('延伸期開放（示範預覽）');return}
 if(a==='csv'){const d=T[k];const rows=[['空間','設備','狀態','說明'],...d.sp.map(r=>[r[0],r[1],B[r[3]][0],r[2]])];
  const blob=new Blob(['﻿'+rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n')],{type:'text/csv'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='保養紀錄_示意.csv';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已匯出（示意資料）');return}
 toast({merge:'已合併成一次到府，生活顧問會聯絡您確認時段（示意）',book:'已預約休館時段（示意）',fix:'已送出報修，並帶入家電檔案（示意）',later:'稍後提醒'}[a]);
});
addEventListener('jjjphase',()=>render());
render();
})();
</script>
</body>
</html>
