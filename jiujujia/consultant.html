<html lang="zh-Hant">
<head>
<script src="backend.js?v=20261027g"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>揪居家｜生活顧問端</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#C42D5A;--brand-soft:#F7E9EE;--ink:#3D3A40;--muted:#6F6670;--line:#E7E2E4;--bg:#F6F4F2;--card:#FFFFFF;--head:#F8F9FB;--side:#3D3A40;--sideink:#C9CED6;
 --r:#C42D5A;--y:#D9971F;--g:#138F3B;--note:#FAF6EE;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6E8EB;--muted:#9AA1AB;--line:#2E333A;--bg:#14171B;--card:#1C2026;--head:#20252C;--side:#0F1215;--brand-soft:#3A1A24;--note:#2A2620}}
:root[data-theme="dark"]{--ink:#E6E8EB;--muted:#9AA1AB;--line:#2E333A;--bg:#14171B;--card:#1C2026;--head:#20252C;--side:#0F1215;--brand-soft:#3A1A24;--note:#2A2620}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--side);color:var(--sideink);padding:14px 10px;position:sticky;top:0;height:100vh}
.logo{color:#fff;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;padding:4px 8px 4px}
.logo i{width:6px;height:18px;background:var(--brand);border-radius:2px}
.role{font-size:12px;color:#fff;background:var(--brand);border-radius:9px;padding:1px 8px;margin:4px 8px 14px;display:inline-block}
.nav button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 10px;border-radius:6px;font-size:14px;color:var(--sideink)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.nav .n{font-size:12px;background:var(--brand);color:#fff;border-radius:9px;padding:0 6px}
.side .sec{font-size:12px;opacity:.6;padding:12px 10px 4px}
.side a{color:var(--sideink);font-size:13px;display:block;padding:6px 10px;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0}.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.proto{margin-left:auto;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:2px 8px}
.b{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px}
.b.pri{background:var(--brand);border-color:var(--brand);color:#fff}.b:disabled{opacity:.45;cursor:not-allowed}
main{padding:16px 18px 80px;max-width:1180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;background:var(--head)}
.ph small{font-weight:400;color:var(--muted);font-size:12px}
.pb{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:24px;font-weight:700}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}.item .t{flex:1;min-width:0}.item .s{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:9px;padding:1px 8px;background:var(--brand-soft);color:#8E1E42;white-space:nowrap}
.tag.gray{background:var(--head);color:var(--muted);border:1px solid var(--line)}.tag.ok{background:#E3F2E8;color:#0E6B2D}.tag.am{background:#FFF1D6;color:#8A5A00}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:10px 0 14px}
.tabs button{padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected="true"]{border-color:var(--brand);color:var(--ink);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}th{background:var(--head);font-weight:500;color:var(--muted);border-top:0}
.mu{color:var(--muted)}.sm{font-size:12px}
.note{background:var(--note);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ver.sent{background:var(--head)}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:2px 10px}
.steps span.on{background:var(--brand);border-color:var(--brand);color:#fff}.steps span.done{background:#E3F2E8;border-color:#BFE3CB;color:#0E6B2D}
.jt .it{display:grid;grid-template-columns:52px 28px 1fr;min-height:34px}.jt .d{font-size:12px;color:#AAA6A0;text-align:right;line-height:1.3;padding-top:1px}
.jt .dt{position:relative}.jt .dt i{position:absolute;left:8px;top:3px;width:12px;height:12px;border-radius:50%;background:#C9C7C3}
.jt .it:not(:last-child) .dt:after{content:"";position:absolute;left:13px;top:15px;bottom:-3px;width:2px;background:#DDDBD7}
.jt .t{font-size:13.5px;color:#A8A5A0;padding-left:4px;line-height:1.35}.jt .t small{display:block;font-size:12px;color:#B8B5B0}
.jt .dn .d{color:var(--muted)}.jt .dn .dt i,.jt .dn .dt:after{background:var(--brand)!important}.jt .dn .t{color:var(--brand);font-weight:700}.jt .dn .t small{color:var(--muted);font-weight:400}
.jt .cu .d{color:var(--ink);font-weight:700}.jt .cu .dt i{background:var(--brand);width:16px;height:16px;left:6px;top:1px;box-shadow:0 0 0 5px #F2C94C}.jt .cu .t{color:var(--brand);font-weight:900}.jt .cu .t small{color:var(--ink);font-weight:400}
.jh{display:flex;align-items:flex-start;margin:4px 0 8px}.jh .s{flex:1;position:relative;height:20px}
.jh .s i{display:block;width:12px;height:12px;border-radius:50%;background:#C9C7C3;margin:4px auto;position:relative;z-index:1}
.jh .s:not(:last-child):after{content:"";position:absolute;top:9px;left:50%;right:-50%;height:2px;background:#DDDBD7}
.jh .dn i,.jh .dn:after{background:var(--brand)!important}.jh .cu i{background:var(--brand);width:16px;height:16px;margin:2px auto;box-shadow:0 0 0 5px #F2C94C}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}.wk .pk{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.wk .pk.open{border:1.5px solid var(--brand)}.wk .tg{float:right;font-size:12.5px;font-weight:700;color:var(--brand);background:none;border:0;cursor:pointer;padding:0}
.wk .acc{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:12.5px;line-height:1.8}.wk .acc .ok{color:var(--brand)}.wk .acc .now{color:var(--brand);font-weight:700}.wk .acc .no{color:#A8A5A0}.wk .acc .df{color:#C25A00}
.tag.cu2{background:#FFF3C4;color:#7A5A00}.tag.dnr{background:var(--brand-soft);color:var(--brand)}
@media(max-width:900px){.wk{grid-template-columns:1fr 1fr}}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}.flow .pk{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px}
.flow .ar{align-self:center;color:var(--muted)}
.mtabs{display:none}
#guide{position:fixed;right:16px;bottom:16px;width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:14px;z-index:20}
#guide h3{margin:0 0 4px;font-size:15px}#guide .n{font-size:12px;color:var(--brand);font-weight:700}
.hl{outline:3px solid var(--brand);outline-offset:3px;border-radius:10px}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.mtabs{display:flex;overflow-x:auto;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
 .mtabs button{white-space:nowrap;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:13px}.mtabs button[aria-current="page"]{background:var(--brand);color:#fff;border-color:var(--brand)}
 main{padding:12px}.proto{margin-left:0}}
</style>
<style>
#cGate{position:fixed;inset:0;z-index:9000;background:#ECE7E3;display:flex;align-items:center;justify-content:center;padding:24px}
#cGate[hidden]{display:none}
#cGate .box{width:min(920px,100%);min-height:460px;display:flex;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(61,58,64,.2);background:#fff}
#cGate .sd{width:44%;background:linear-gradient(160deg,#B23A62,#8E1E42 60%,#6E1634);color:#fff;padding:40px 32px}
#cGate .sd .tg{display:inline-block;background:rgba(255,255,255,.18);border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700}
#cGate .sd h2{margin:10px 0 6px;font-size:28px}#cGate .sd p{margin:0 0 14px;opacity:.9}#cGate .sd li{margin:8px 0}
#cGate form{flex:1;padding:44px 40px;background:#FBFAF9;color:#3D3A40}#cGate h3{margin:0 0 4px;font-size:22px}#cGate .sub{font-size:14px;color:#6F6670;margin-bottom:14px}
#cGate label{display:block;font-size:14px;color:#6F6670;margin-top:10px}#cGate input{display:block;width:100%;margin-top:4px;height:40px;border:1px solid #DDD5D0;border-radius:8px;padding:0 10px;font:inherit}
#cGate .go{display:block;width:100%;height:42px;margin-top:14px;border:0;border-radius:10px;background:#C42D5A;color:#fff;font:inherit;font-weight:700;cursor:pointer}
#cGate .dm{margin-top:14px;border:2px dashed #E6B3C3;border-radius:12px;padding:10px}#cGate .dm b{font-size:13px;color:#8E1E42}
#cGate .dm button{display:block;width:100%;margin-top:8px;height:44px;border-radius:10px;border:2px solid #C42D5A;background:#F7E9EE;color:#8E1E42;font:inherit;font-weight:900;cursor:pointer}
#cGate .er{color:#B33A1C;font-size:14px;margin-top:8px;min-height:1em}#cGate .oth{font-size:13px;color:#6F6670;margin-top:12px}#cGate .oth a{color:#C42D5A;font-weight:700}
@media (max-width:700px){#cGate .box{flex-direction:column}#cGate .sd{width:auto;padding:24px}}
</style>
</head>
<body>
<div id="cGate" hidden><div class="box"><div class="sd"><span class="tg">企業管理端（電腦版）｜生活顧問</span><h2>今天的家庭，一次看完</h2><p>在門市電腦整合報價、排工作包；外出與到府請用揪居家 App</p><ul><li>新進案件與 AI 分析</li><li>整合報價、版本紀錄</li><li>工作包與施工順序、差異核准</li></ul></div>
<form id="cLogin" novalidate><h3>生活顧問登入</h3><div class="sub">請用門市配發的帳號；需已取得居安規劃認證</div><label>Email<input name="email" type="email" autocomplete="username"></label><label>密碼<input name="password" type="password" autocomplete="current-password"></label><div class="er" role="alert"></div><button class="go" type="submit">登入生活顧問端</button>
<div class="dm"><b>示範帳號</b><button type="button" data-demo="advisor@example.com">▶ 一鍵登入｜王小明（台中逢甲店）</button></div>
<div class="oth">家庭與技師 → <a href="app.html">揪居家 App（手機）</a>　總部 → <a href="admin.html">企業管理端（電腦版）</a></div></form></div></div>
<div class="app">
 <aside class="side" aria-label="生活顧問端選單">
  <div class="logo"><i></i>揪居家｜生活顧問端</div><span class="role">/consultant</span>
  <div class="nav" id="nav"></div>
  <div class="sec">其他端</div>
  <a href="../consumer">消費者端 /consumer ›</a><a href="../technician">技師端 /technician ›</a><a href="../admin">企業管理端 /admin ›</a>
 </aside>
 <div>
  <div class="top"><h1 id="title">顧問工作台</h1><div class="meta"><span>生活顧問 <b id="who">—</b></span><span id="store">—</span></div><span class="proto">原型：資料存在這台瀏覽器，非正式雲端</span><button class="b" id="guideBtn">顧問端導覽</button></div>
  <div class="mtabs" id="mtabs"></div>
  <main id="view" aria-live="polite">載入中…</main>
 </div>
</div>
<script>
(function(){
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','X-JJJ':'1'},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'操作失敗');return d};
const LC={r:['紅燈','var(--r)'],y:['黃燈','var(--y)'],g:['綠燈','var(--g)']};
const NAV=[['wb','顧問工作台'],['cases','案件管理'],['prod','商品與改善方案'],['quote','整合報價'],['sched','排程與服務協調'],['after','確認、驗收與售後']];
const TABS=['案件摘要','AI 分析','空間與成果','改善方案','商品與款式','報價','確認與同意','工單與排程','驗收與售後'];
const ST={view:'wb',hid:3,tab:0,me:null,home:null,todos:null,plans:{}};
// 四類改善方式（示範資料）：顧問依個案逐項調整
const OPTS={
 '走道':{why:'夜間偏暗、有門檻，寬 92 cm',l:'r',items:[
  {t:'免費調整',n:'鞋櫃移出走廊',p:0,est:false,d:'當天',by:'家人自行調整',dep:'—',acc:'顧問電話確認',chk:'無'},
  {t:'全國電子安裝',n:'感應夜燈',p:900,est:false,d:'當天',by:'全國電子技師',dep:'確認插座位置',acc:'關燈測試感應距離與亮度',chk:'插座是否被家具擋住'},
  {t:'簡易施工',n:'止滑卡扣地板（淺橡木）',p:2400,est:false,d:'半天',by:'協力工班｜地坪止滑',dep:'先於夜燈安裝',acc:'不拆除、可復原；協力工班書面保固',chk:'地面平整度'}]},
 '浴室':{why:'門檻 2 cm、磁磚地',l:'y',items:[
  {t:'全國電子安裝',n:'斜坡墊＋止滑地墊',p:800,est:false,d:'當天',by:'全國電子技師',dep:'—',acc:'長輩實際走一次',chk:'門檻實際高度'},
  {t:'簡易施工',n:'木製斜坡＋地面止滑',p:2600,est:false,d:'半天',by:'協力工班｜木作、地坪止滑',dep:'先於感測器安裝',acc:'協力工班書面保固',chk:'門框材質'},
  {t:'改造工程',n:'移除門檻、更換止滑磁磚',p:null,est:true,d:'約 3 天',by:'協力工班｜泥作（含防水）',dep:'需事前核准的補助，核准前不施工',acc:'防水測試＋協力工班書面保固',chk:'需到府估價、確認防水層'}]},
 '浴室門':{why:'門往內開，長輩若在浴室跌倒可能擋住門',l:'y',items:[
  {t:'全國電子安裝',n:'防夾門擋',p:300,est:false,d:'當天',by:'全國電子技師',dep:'—',acc:'開關門測試',chk:'無'},
  {t:'簡易施工',n:'可從外側解鎖的把手',p:1800,est:false,d:'半天',by:'協力工班｜門窗（限浴室門）',dep:'—',acc:'外側解鎖測試',chk:'門扇材質'},
  {t:'改造工程',n:'改為外開門或橫拉門',p:null,est:true,d:'約 1–3 天',by:'協力工班｜門窗（限浴室門）',dep:'租屋須房東同意',acc:'協力工班書面保固',chk:'需到府估價'}]}};
const SEL=LS.get('jjj_v5_csel',{3:{'走道':[1],'浴室':[0],'浴室門':[1]}});
const QUO=LS.get('jjj_v5_quotes',{});
const SUB=LS.get('jjj_v5_subsidy',{});
const save=()=>{LS.set('jjj_v5_csel',SEL);LS.set('jjj_v5_quotes',QUO);LS.set('jjj_v5_subsidy',SUB)};
const fmt=n=>n==null?'待估價':n===0?'免費':'NT$'+n.toLocaleString();
const addM=(d,m)=>{const x=new Date(d.replace(' ','T'));x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};

// 生活顧問（門市電腦）登入頁：企業管理端（電腦版）的一部分；手機外出用揪居家 App
function gateLogin(){return new Promise(res=>{const g=document.getElementById('cGate'),f=document.getElementById('cLogin'),er=f.querySelector('.er');g.hidden=false;
 const WR={family:'這是家庭帳號，請改用 <a href="app.html">揪居家 App（手機）</a>。',tech:'這是技師帳號，請改用 <a href="app.html">揪居家 App（手機）</a>。',hq:'這是總部帳號，請改用 <a href="admin.html">企業管理端（電腦版）</a>。'};
 async function go(email,pw){er.textContent='';try{const d=await api('/auth/login',{method:'POST',body:{email,password:pw}});if(d.user.role!=='advisor'){try{await api('/auth/logout',{method:'POST'})}catch(e){}er.innerHTML=WR[d.user.role]||'這個帳號不能在這裡登入。';return}g.hidden=true;res(d.user)}catch(x){er.textContent=x.message}}
 f.onsubmit=e=>{e.preventDefault();go(f.email.value.trim(),f.password.value)};
 f.querySelector('[data-demo]').onclick=e=>go(e.currentTarget.dataset.demo,'demo1234')})}
async function boot(){
 try{ST.me=(await api('/me')).user}catch(e){ST.me=null}
 if(ST.me&&ST.me.role!=='advisor'){try{await api('/auth/logout',{method:'POST'})}catch(e){}ST.me=null}
 if(!ST.me){ST.me=await gateLogin()}
 document.getElementById('who').textContent=ST.me.name;document.getElementById('store').textContent=ST.me.store;
 const [h,t]=await Promise.all([api('/advisor/home'),api('/advisor/todos')]);ST.home=h;ST.todos=t;
 for(const id of [2,3,4]){try{ST.plans[id]=await api('/advisor/plan/'+id)}catch(e){}}
 const q=new URLSearchParams(location.search);if(q.get('view'))ST.view=q.get('view');if(q.get('hid'))ST.hid=+q.get('hid');if(q.get('tab'))ST.tab=+q.get('tab');
 render();
}
const handoffs=()=>LS.get('jjj_v5_handoff',[]);
function cases(){return [2,3,4].map(id=>ST.plans[id]).filter(Boolean)}
function JT(rows){return `<div class="jt">${rows.map(([st,d,t,sm])=>`<div class="it ${st||'td'}"><div class="d">${d||''}</div><div class="dt"><i></i></div><div class="t">${t}${sm?`<small>${sm}</small>`:''}</div></div>`).join('')}</div>`}
function mdx(v){const m=String(v||'').match(/(\d{4}-)?(\d{1,2})[\/-](\d{1,2})/);return m?(+m[2])+'/'+m[3].padStart(2,'0'):''}

 const pDone=bd>0||ad>0||p.phase>=9,bDone=bn&&bd===bn,aDone=an&&ad===an,acc=p.phase>=9;

 const pinRows=pk=>{const X=L(pk),cur=X.findIndex(x=>x.st!=='done');return X.map((x,i)=>x.st==='done'?`<span class="ok">✓ ${esc(x.label)}</span>`:x.st==='diff'?`<span class="df">! ${esc(x.label)}（差異待確認）</span>`:i===cur&&st[pk==='B'?1:2]==='cu'?`<span class="now">● ${esc(x.label)}（施工中）</span>`:`<span class="no">○ ${esc(x.label)}</span>`).join('<br>')||'<span class="no">—</span>'};
 const T={dn:'tag dnr',cu:'tag cu2',td:'tag gray'};
 const C=[['P','協力工班施工',ch.length?ch.map(i=>esc(i.n)).join('、'):'本案無協力工班項目',ch.length?(pDone?'完成（示範資料）':'待排程（示範資料）'):'不適用',ch.length?ch.map(i=>(pDone?'<span class="ok">✓ ':'<span class="no">○ ')+esc(i.n)+'</span>').join('<br>')+'<br><span class="no">完工拍照後，技師的工作才解鎖</span>':'<span class="no">本案沒有需要動工的項目</span>'],
  ['B','夜間照明','全國電子技師',bn?`${bd}／${bn} 完成`:'—',pinRows('B')],
  ['A','關懷設備','全國電子技師',an?`${ad}／${an} 完成`:'—',pinRows('A')],
  ['V','長輩逐區驗收','技師陪同',acc?'已驗收':'等待',['臥室','走道','浴室','玄關'].map(r=>(acc?'<span class="ok">✓ ':'<span class="no">○ ')+r+'</span>').join('<br>')+'<br><span class="no">長輩說有問題就退回相關項目</span>']];
 return `<div class="panel"><div class="ph">工作包與施工順序 <small>需要動工的項目由協力工班先完成，全國電子技師再安裝設備</small></div><div class="pb">
 <div class="jh">${st.map(x=>`<div class="s ${x}"><i></i></div>`).join('')}</div>
 <div class="wk">${C.map(([k,n,team,tg,body],i)=>`<div class="pk${O[k]?' open':''}"><b>${n}</b><button class="tg" data-pk="${k}" aria-expanded="${!!O[k]}">${O[k]?'收合 ▴':'明細 ▾'}</button><div class="sm">${team}</div><span class="${T[st[i]]}" style="margin-top:6px;display:inline-block">${tg}</span>${O[k]?`<div class="acc">${body}</div>`:''}</div>`).join('')}</div>
 <p class="mu sm" style="margin-top:10px">前置工作未完成時，後續工單顯示等待；支援待料、延期、客戶改期與異常。技師現場差異回報後由顧問核准，顧問不能覆蓋技師的原始核對紀錄。</p></div></div>`}
function tAfter(p){const hid=p.household_id,s=SUB[hid]||{};const rq=(ST.todos.requests||[]).filter(r=>r.household===p.household);
 return `<div class="grid"><div class="panel"><div class="ph">補助轉介 <small>長照居家無障礙改善補助</small></div><div class="pb">
 <div class="item"><span class="t">長輩是否已有長照服務</span><select data-sub="has" aria-label="是否已有長照服務"><option ${s.has==='未確認'||!s.has?'selected':''}>未確認</option><option ${s.has==='有'?'selected':''}>有</option><option ${s.has==='沒有'?'selected':''}>沒有</option></select></div>
 <div class="item"><span class="t">已轉介 1966</span><input type="checkbox" data-sub="ref" ${s.ref?'checked':''} aria-label="已轉介 1966"></div>
 <div class="item"><span class="t">核准狀態</span><select data-sub="ok" aria-label="核准狀態"><option ${!s.ok||s.ok==='待評估'?'selected':''}>待評估</option><option ${s.ok==='已核准'?'selected':''}>已核准</option><option ${s.ok==='不符資格'?'selected':''}>不符資格</option></select></div>
 <p class="mu sm">生活顧問協助轉介，不代辦、不保證核准；需事前核准的工程，核准前不派工。</p></div></div>
 <div class="panel"><div class="ph">驗收、保固與後續需求</div><div class="pb">${rq.map(r=>`<div class="item"><span class="t"><b>${esc(r.kind)}</b><div class="s">${esc(r.when)}｜${esc(r.note)}</div></span><span class="tag am">${esc(r.status)}</span></div>`).join('')||'<div class="mu">目前沒有售後需求。</div>'}
 <div class="item"><span class="t">設備保固</span><span class="tag gray">依商品保固</span></div><div class="item"><span class="t">協力工班施工保固</span><span class="tag gray">協力工班書面保固</span></div></div></div></div>`}
function vProd(){ST.hid=ST.hid||3;return `<div class="note" style="margin-bottom:12px">以林女士家為例；實際操作請從「案件管理」進入個案。</div>${tProd()}<div style="height:12px"></div>${tOpt(ST.plans[3])}`}
function vQuoteList(){return `<div class="panel"><div class="ph">報價總覽</div><div class="pb">${cases().map(p=>{const L=quotes(p.household_id);return `<button class="item" data-case="${p.household_id}" data-tabgo="5"><span class="t"><b>${esc(p.household)}</b><div class="s">${L.length?`最新 v${L[0].v}｜NT$${L[0].total.toLocaleString()}`:'尚未送出報價'}</div></span><span class="tag ${L.length?'ok':'gray'}">${L.length?L.length+' 個版本':'待報價'}</span></button>`}).join('')}</div></div>`}
function vSched(){return cases().filter(p=>p.phase>=3).map(p=>`<div style="margin-bottom:12px"><h3 style="margin:0 0 8px;font-size:15px">${esc(p.household)}</h3>${tWork(p)}</div>`).join('')}
function vAfter(){return cases().map(p=>`<div style="margin-bottom:12px"><h3 style="margin:0 0 8px;font-size:15px">${esc(p.household)}</h3>${tAfter(p)}</div>`).join('')}

document.addEventListener('click',e=>{const k=e.target.closest('[data-pk]');if(k){const O=ST.pkOpen||(ST.pkOpen={});O[k.dataset.pk]=!O[k.dataset.pk];render();return}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-case],[data-tab],[data-q]');if(!t)return;
 if(t.dataset.v){ST.view=t.dataset.v}else if(t.dataset.case){ST.hid=+t.dataset.case;ST.tab=t.dataset.tabgo?+t.dataset.tabgo:0;ST.view='case'}
 else if(t.dataset.tab){ST.tab=+t.dataset.tab}
 else if(t.dataset.q==='send'){const p=ST.plans[ST.hid],items=chosen(ST.hid),L=quotes(ST.hid),dev=(p.plan||{}).one_time||5900;
  const d=new Date(),at=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  L.unshift({v:L.length+1,at,total:dev+items.filter(i=>!i.est).reduce((a,b)=>a+(b.p||0),0),pending:items.filter(i=>i.est).length,items:['揪夜安設備＋設定費'].concat(items.map(i=>i.sp+'｜'+i.n))});save()}
 render();window.scrollTo(0,0)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.opt){const [sp,i]=t.dataset.opt.split('|'),s=sel(ST.hid);s[sp]=s[sp]||[];const n=+i;s[sp]=t.checked?[...new Set(s[sp].concat(n))]:s[sp].filter(x=>x!==n);save()}
 if(t.dataset.sub){const s=SUB[ST.hid]||(SUB[ST.hid]={});s[t.dataset.sub]=t.type==='checkbox'?t.checked:t.value;save()}});

// 顧問端導覽
const G=[['wb',null,'顧問工作台','首頁直接列出今天要做的事：今日預約、家庭交付的改善選擇、新進 AI 分析與售後。'],
 ['case',1,'AI 分析','先解釋燈號與分析理由；AI 無法判定的項目列為待現場確認，不直接當成正式鑑定。'],
 ['case',3,'改善方案','四類改善方式逐項勾選：免費調整、全國電子安裝、簡易施工、改造工程（需到府估價）。'],
 ['case',5,'整合報價','一張報價整合設備、安裝與協力工班；待估價項目不套用示範價格，送出後保留版本。'],
 ['case',6,'長輩確認','長輩本人到門市確認才成交；影像確認版需書面同意。'],
 ['case',7,'工單與排程','協力工班先做需要動工的項目，全國電子技師再安裝設備，前置未完成就等待。'],
 ['case',8,'驗收與售後','記錄補助轉介 1966、核准狀態、保固與後續需求。導覽到這裡結束，可以自由操作。']];
function guide(i){let g=document.getElementById('guide');if(i>=G.length){if(g)g.remove();return}const [v,tab,h,d]=G[i];
 if(v==='case'){ST.view='case';ST.hid=3;ST.tab=tab}else ST.view=v;render();
 if(!g){g=document.createElement('div');g.id='guide';document.body.appendChild(g)}
 g.innerHTML=`<div class="n">顧問端導覽 ${i+1}／${G.length}</div><h3>${h}</h3><p class="mu" style="margin:0 0 10px">${d}</p><div style="display:flex;gap:6px"><button class="b pri" id="gN">${i===G.length-1?'完成':'下一步'}</button><button class="b" id="gX">關閉</button></div>`;
 g.querySelector('#gN').onclick=()=>guide(i+1);g.querySelector('#gX').onclick=()=>g.remove()}
document.getElementById('guideBtn').onclick=()=>window.JJJGUIDE&&JJJGUIDE.start();
window.JCON={ST,render};
boot().catch(e=>{document.getElementById('view').textContent='載入失敗：'+e.message});
})();
