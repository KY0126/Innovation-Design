# 揪居家原型｜每次推送或開 PR：先跑 Lint、用語、單元、安全掃描，再跑 Playwright（系統＋各層）
name: 測試（Lint、單元、E2E 與各層）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 第一段：Lint（程式＋用語）、單元測試、金鑰與套件漏洞掃描；沒過就不跑後面的瀏覽器測試
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 安裝 Lint 工具
        run: npm install --no-audit --no-fund
      - name: ESLint（只看新增的問題）
        run: npm run lint
      - name: 用語檢查（只看新增的禁用詞）
        run: npm run terms
      - name: 單元測試
        run: npm run unit
      - name: 套件漏洞（高風險以上才算失敗）
        run: |
          npm audit --audit-level=high
          cd ../e2e && npm install --no-fund --package-lock-only >/dev/null 2>&1; npm audit --audit-level=high
      - name: 掃描金鑰外洩
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 第二段：系統（E2E）與 tests/ 底下的整合、安全、回復、效能、壓力（前端）
  test:
    needs: checks
    # 固定版本：Playwright 1.56 尚未支援 Ubuntu 26（ubuntu-latest 自 2026/10 起逐步切換）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei   # 示範資料的「今天」與台灣時間一致
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安裝 Playwright
        timeout-minutes: 5
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ../install.log

      - name: 快取瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-1.56.0

      - name: 下載瀏覽器
        timeout-minutes: 8
        run: npx playwright install chromium 2>&1 | tail -n 3 | tee -a ../install.log

      - name: 安裝系統套件與中文字型（失敗自動重試）
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo npx playwright install-deps chromium > ../deps.log 2>&1 && break
            echo "第 $i 次安裝失敗，30 秒後重試"; sleep 30
          done
          tail -n 3 ../deps.log | tee -a ../install.log

      - name: 執行測試
        timeout-minutes: 12
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../test.log

      - name: 失敗時把失敗的測試標在這次執行上
        if: ${{ failure() }}
        run: |
          if [ -f results.json ]; then
            node -e '
              const r = require("./results.json"); const out = [];
              const walk = (s, p) => { (s.suites || []).forEach(x => walk(x, p.concat(x.title))); (s.specs || []).forEach(sp => sp.tests.forEach(t => { const last = t.results[t.results.length - 1] || {}; if (t.status === "unexpected" || t.status === "flaky") { const msg = ((last.error && last.error.message) || "").replace(/\x1b\[[0-9;]*m/g, "").split("\n").filter(Boolean).slice(0, 3).join(" ／ "); out.push(`${t.projectName}｜${p.concat(sp.title).filter(Boolean).join(" › ")}｜${t.status === "flaky" ? "重跑才過" : "失敗"}：${msg}`); } })); };
              walk(r, []);
              console.log(`::error title=測試結果::${r.stats.expected} 通過、${r.stats.unexpected} 失敗、${r.stats.flaky} 重跑才過`);
              out.slice(0, 9).forEach(l => console.log("::error title=失敗項目::" + l.slice(0, 900)));
            '
          else
            tail -n 9 ../install.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error title=安裝::$l"; done
          fi

      - name: 上傳測試報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
