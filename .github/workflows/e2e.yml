# 揪居家原型｜端到端測試：每次推送或開 PR 都自動跑 e2e/ 的 Playwright 測試
name: e2e 端到端測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # 固定版本：Playwright 1.56 尚未支援 Ubuntu 26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安裝中文字型（讓版面與真實裝置一致）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安裝 Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 執行測試
        run: npm test

      - name: 上傳測試報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 14
