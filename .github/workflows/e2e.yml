# 揪居家原型｜端到端測試：每次推送或開 PR 都自動跑 e2e/ 的 Playwright 測試
name: e2e 端到端測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 固定版本：Playwright 1.56 尚未支援 Ubuntu 26（ubuntu-latest 自 2026/10 起逐步切換）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安裝 Playwright 與瀏覽器（含中文字型）
        timeout-minutes: 10
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ../install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a ../install.log

      - name: 執行測試
        timeout-minutes: 12
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../test.log

      - name: 失敗時把失敗的測試標在這次執行上
        if: ${{ failure() }}
        run: |
          if [ -f results.json ]; then
            node -e '
              const r = require("./results.json"); const out = [];
              const walk = (s, p) => { (s.suites || []).forEach(x => walk(x, p.concat(x.title))); (s.specs || []).forEach(sp => sp.tests.forEach(t => { const last = t.results[t.results.length - 1] || {}; if (t.status === "unexpected" || t.status === "flaky") { const msg = ((last.error && last.error.message) || "").replace(/\x1b\[[0-9;]*m/g, "").split("\n").filter(Boolean).slice(0, 3).join(" ／ "); out.push(`${t.projectName}｜${p.concat(sp.title).filter(Boolean).join(" › ")}｜${t.status === "flaky" ? "重跑才過" : "失敗"}：${msg}`); } })); };
              walk(r, []);
              console.log(`::error title=測試結果::${r.stats.expected} 通過、${r.stats.unexpected} 失敗、${r.stats.flaky} 重跑才過`);
              out.slice(0, 9).forEach(l => console.log("::error title=失敗項目::" + l.slice(0, 900)));
            '
          else
            tail -n 9 ../install.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error title=安裝::$l"; done
          fi

      - name: 上傳測試報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
