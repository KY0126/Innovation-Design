# 揪居家原型｜端到端測試：每次推送或開 PR 都自動跑 e2e/ 的 Playwright 測試
name: e2e 端到端測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 固定版本：Playwright 1.56 尚未支援 Ubuntu 26（ubuntu-latest 自 2026/10 起逐步切換）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安裝 Playwright 與瀏覽器（含中文字型）
        timeout-minutes: 10
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ../install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a ../install.log

      - name: 執行測試
        timeout-minutes: 12
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../test.log

      - name: 失敗時把最後幾行輸出標在這次執行上
        if: ${{ failure() }}
        working-directory: .
        run: |
          for f in install.log test.log; do
            [ -f "$f" ] || continue
            tail -n 25 "$f" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::error title=$f::$l"; done
          done

      - name: 上傳測試報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
