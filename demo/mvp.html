<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>揪居家 MVP Demo（1:15）</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(0,0,0,.45);cursor:pointer;border:0;color:#fff;font:inherit;width:100%}
#go .c{width:160px;height:160px;border-radius:50%;background:#C42D5A;border:6px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 48px rgba(0,0,0,.5)}
#go b{font-size:34px;letter-spacing:.05em}
#go small{font-size:18px;opacity:.8}
#go.hide{display:none}
</style></head>
<body>
<video id="v" src="mvp_demo_75s.mp4" poster="mvp_poster.jpg" preload="auto" playsinline controls></video>
<button id="go" type="button" aria-label="全螢幕播放">
  <span class="c"><svg width="70" height="70" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span>
  <b>全螢幕播放</b>
  <small>點一下，或按空白鍵／簡報筆下一頁</small>
</button>
<script>
const v=document.getElementById('v'),go=document.getElementById('go');
function start(){
  go.classList.add('hide');
  const el=document.documentElement;
  try{(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}catch(e){}
  v.currentTime=0;const p=v.play();if(p&&p.catch)p.catch(()=>{});
}
go.addEventListener('click',start);
addEventListener('keydown',e=>{
  if(!go.classList.contains('hide')){e.preventDefault();start();return}
  if(e.key==='f'||e.key==='F'){const el=document.documentElement;document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()}
});
v.addEventListener('ended',()=>{if(document.fullscreenElement)document.exitFullscreen()});
</script>
</body></html>
